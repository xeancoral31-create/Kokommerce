[variables]
    PHP_VERSION = '8.2'
    NIXPACKS_PHP_VERSION = '8.2'
    NODE_VERSION = '18'
    NIXPACKS_PHP_ROOT = '/public'

[phases.setup]
    nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_18']

[phases.install]
    cmds = ['composer install --optimize-autoloader --no-dev --no-interaction', 'npm install']

[phases.build]
    dependsOn = ['install']
    cmds = ['npm run prod', 'php artisan optimize', 'php artisan view:cache']

[start]
    cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'
